server:
  port: 8080
  
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/game_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
        
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
      
  data:
    redis:
      host: localhost
      port: 6379
      
      